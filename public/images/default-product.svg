<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF7F5"/>
      <stop offset="100%" stop-color="#FEECEB"/>
    </linearGradient>
    <linearGradient id="pouchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B91C1C"/>
      <stop offset="100%" stop-color="#6B1414"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#6B1414" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="400" height="400" rx="20" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="398" height="398" rx="19" fill="none" stroke="#FCA5A5" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Spice Pouch / Pack Illustration -->
  <g filter="url(#shadow)">
    <!-- Main Pouch Body -->
    <path d="M 120 110 Q 200 102 280 110 L 295 300 Q 200 320 105 300 Z" fill="url(#pouchGrad)"/>
    <!-- Pouch Top Seal / Ziplock -->
    <path d="M 115 110 Q 200 102 285 110 L 282 85 Q 200 78 118 85 Z" fill="#7F1D1D"/>
    <!-- Seal Lines -->
    <line x1="124" y1="92" x2="276" y2="92" stroke="#FDE047" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.85"/>
    <line x1="122" y1="99" x2="278" y2="99" stroke="#EF4444" stroke-width="1"/>
    
    <!-- Pouch Center Label Badge -->
    <rect x="142" y="136" width="116" height="124" rx="14" fill="#FFFFFF" opacity="0.96"/>
    <rect x="146" y="140" width="108" height="116" rx="11" fill="none" stroke="url(#goldGrad)" stroke-width="1.5"/>

    <!-- Spice Bowl / Masala Icon in Label -->
    <g transform="translate(170, 150)">
      <!-- Bowl -->
      <path d="M 5 28 Q 30 50 55 28 Z" fill="#C81E1E"/>
      <ellipse cx="30" cy="28" rx="25" ry="6" fill="#F59E0B"/>
      <!-- Steam / Aroma -->
      <path d="M 22 20 Q 20 14 24 8" stroke="#DC2626" stroke-width="2" stroke-linecap="round" fill="none"/>
      <path d="M 30 18 Q 32 12 28 6" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <path d="M 38 20 Q 40 14 36 8" stroke="#DC2626" stroke-width="2" stroke-linecap="round" fill="none"/>
    </g>

    <!-- Text: SPICES DABBA -->
    <text x="200" y="218" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="#6B1414" text-anchor="middle" letter-spacing="1.2">SPICES DABBA</text>
    <text x="200" y="234" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#71717A" text-anchor="middle" letter-spacing="0.5">AUTHENTIC SPICES</text>

    <!-- Gold Accent Star -->
    <polygon points="200,242 202,246 206,246 203,249 204,253 200,250 196,253 197,249 194,246 198,246" fill="#F59E0B"/>
  </g>

  <!-- Pouch Bottom Badge -->
  <rect x="170" y="278" width="60" height="16" rx="8" fill="#FDE047" opacity="0.95"/>
  <text x="200" y="290" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="800" fill="#6B1414" text-anchor="middle">PURE SPICES</text>
</svg>

